<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ee;--card:#fff;--tx:#1d1b22;--mu:#76717f;--bd:#e4dfe0;--ac:#f2552c;--ok:#16a34a;--gr:linear-gradient(90deg,#f2552c,#f5b800);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1820;--card:#27242f;--tx:#f3f0f6;--mu:#a29bb0;--bd:#37333f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1820;--card:#27242f;--tx:#f3f0f6;--mu:#a29bb0;--bd:#37333f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Khmer OS","Noto Sans Khmer",system-ui,sans-serif;line-height:1.45}
.w{max-width:720px;margin:0 auto;padding:12px 12px 90px}
header{display:flex;align-items:center;margin-bottom:12px}header b{flex:1;font-size:20px}
header a{padding:6px 12px;border-radius:99px;background:var(--gr);color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.bn{position:relative;height:150px;border-radius:16px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 44px;margin-bottom:16px;transition:background .4s}
.bn h1{margin:0;font-size:24px;text-shadow:0 2px 6px rgba(0,0,0,.3)}.bn p{margin:4px 0 0;font-size:14px}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;border:0;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-size:18px;cursor:pointer}
.dt{position:absolute;bottom:8px;display:flex;gap:5px}.dt i{width:16px;height:5px;border-radius:9px;background:rgba(255,255,255,.45)}.dt i.on{background:#f5b800;width:26px}
.sh{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.sh b{flex:1;font-size:18px;color:var(--ac)}.sh span{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mu)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.gc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px}
.art{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff}
.gn{font-weight:700;font-size:13px;margin:8px 2px;min-height:38px}
.top{width:100%;border:0;border-radius:9px;background:var(--gr);color:#fff;font:inherit;font-size:13px;font-weight:700;min-height:44px;cursor:pointer;touch-action:manipulation}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
input{-webkit-appearance:none;appearance:none}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.p{border:2px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg);color:var(--tx);text-align:left;font:inherit;min-height:44px;touch-action:manipulation}
.p.on{border-color:var(--ac)}.p small{display:block;color:var(--mu)}.p b{color:var(--ac)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gr);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:44px;touch-action:manipulation;display:block;text-align:center;text-decoration:none}
.btn.ok{background:var(--ok)}.btn.g2{background:var(--bd);color:var(--tx);margin-top:8px}
.back{border:0;background:none;color:var(--ac);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ph .art{width:54px;font-size:28px;flex:none}.ph b{font-size:18px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:9;overflow-y:auto;-webkit-overflow-scrolling:touch}
.md .card{max-width:360px;width:100%;text-align:center;margin:auto}
.md img{width:210px;max-width:70%;background:#fff;padding:6px;border-radius:8px}
.amt{font-size:26px;font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}ol{text-align:left;padding-left:20px;font-size:14px;margin:8px 0}
.fh{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 12px;text-align:center;font-size:12px;color:var(--tx);text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.fh span{display:block;font-size:24px}
